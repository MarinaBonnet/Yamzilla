version: "3.9"

services:
  backend:
    build: ./backend
    container_name: yamzilla-backend
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: yamzilla-frontend
    ports:
      - "${FRONTEND_PORT}:80"

  db:
    image: mysql:8
    container_name: yamzilla-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
